<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Track HMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../assets/images/track-logo.png">

    <!-- Library / Plugin Css Build -->
    <link rel="stylesheet" href="../../assets/css/core/libs.min.css">


    <!-- Hope Ui Design System Css -->
    <link rel="stylesheet" href="../../assets/css/hope-ui.css?v=4.0.0">

    <!-- Custom Css -->
    <!-- <link rel="stylesheet" href="../../assets/css/custom.css?v=4.0.0"> -->

    <!-- Dark Css -->
    <link rel="stylesheet" href="../../assets/css/dark.min.css">

    <!-- Customizer Css -->
    <link rel="stylesheet" href="../../assets/css/customizer.css">

    <!-- RTL Css -->
    <link rel="stylesheet" href="../../assets/css/rtl.css">


    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ===== Top Header ===== -->
    <header class="top-header">
        <div class="header-right">
            <div class="dropdown d-flex align-items-center">
                <a class="nav-link d-flex align-items-center p-0" href="#" id="navbarDropdown" role="button"
                    data-bs-toggle="dropdown" aria-expanded="false">

                    <img src="../../assets/images/avatars/avtar_1.png" alt="User-Profile"
                        class="theme-color-cyan-img img-fluid avatar avatar-40 avatar-rounded">

                    <span class="mx-2 user-name" data-ar="أحمد ضرار" data-en="Ahmed Dirar">
                        أحمد ضرار
                    </span>

                    <i class="icon dropdown-icon">
                        <svg width="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                            class="icon-16">
                            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </i>
                </a>

                <!-- Dropdown -->
                <ul class="dropdown-menu dropdown-menu-end p-3 settings-dropdown" aria-labelledby="navbarDropdown">

                    <!-- ===== Color Scheme ===== -->
                    <li>
                        <h5 class="mb-3">Scheme</h5>
                        <div class="d-flex justify-content-center gap-3 mb-4">
                            <div class="btn btn-border" data-setting="color-mode" data-name="color" data-value="dark">
                                <svg class="icon-20" width="20" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path fill="currentColor"
                                        d="M9,2C7.95,2 6.95,2.16 6,2.46C10.06,3.73 13,7.5 13,12C13,16.5 10.06,20.27 6,21.54C6.95,21.84 7.95,22 9,22A10,10 0 0,0 19,12A10,10 0 0,0 9,2Z" />
                                </svg>
                                <span class="ms-2 "> Dark </span>
                            </div>
                            <div class="btn btn-border active" data-setting="color-mode" data-name="color"
                                data-value="light">
                                <svg class="icon-20" width="20" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path fill="currentColor"
                                        d="M12,8A4,4 0 0,0 8,12A4,4 0 0,0 12,16A4,4 0 0,0 16,12A4,4 0 0,0 12,8M12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31L23.31,12L20,8.69Z" />
                                </svg>
                                <span class="ms-2 "> Light</span>
                            </div>
                        </div>
                        <hr class="hr-horizontal">
                    </li>

                    <!-- ===== Direction & Language ===== -->
                    <li>
                        <div class="d-grid gap-3 grid-cols-2 mb-4">

                            <div class="text-center cursor-pointer" onclick="setLanguage('en')">
                                <img src="../../assets/images/settings/dark/01.png" alt="ltr"
                                    class="mode dark-img img-fluid btn-border p-0 flex-column active mb-2"
                                    data-setting="dir-mode" data-name="dir" data-value="ltr">
                                <img src="../../assets/images/settings/light/01.png" alt="ltr"
                                    class="mode light-img img-fluid btn-border p-0 flex-column active mb-2"
                                    data-setting="dir-mode" data-name="dir" data-value="ltr">
                                <span class=" mt-2"> LTR </span>
                            </div>

                            <div class="text-center cursor-pointer" onclick="setLanguage('ar')">
                                <img src="../../assets/images/settings/dark/02.png" alt=""
                                    class="mode dark-img img-fluid btn-border p-0 flex-column mb-2"
                                    data-setting="dir-mode" data-name="dir" data-value="rtl">
                                <img src="../../assets/images/settings/light/02.png" alt=""
                                    class="mode light-img img-fluid btn-border p-0 flex-column mb-2"
                                    data-setting="dir-mode" data-name="dir" data-value="rtl">
                                <span class="mt-2 "> RTL </span>
                            </div>

                        </div>

                        <hr class="hr-horizontal">
                    </li>

                    <!-- ===== Logout ===== -->
                    <li>
                        <a class="dropdown-item" href="../dashboard/sign-in.html" data-ar="تسجيل الخروج"
                            data-en="Logout">
                            تسجيل الخروج
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </header>
    <div class="container">



        <!-- الكروت على اليسار -->
        <div class="right-side">
            <div class="cards-grid">
                <div class="card">
                    <i class="fa-solid fa-stethoscope"></i>
                    <span data-ar="العيادات" data-en="Clinics">العيادات</span>
                </div>

                <div class="card">
                    <i class="fa-solid fa-flask"></i>
                    <span data-ar="المعمل" data-en="Laboratory">المعمل</span>
                </div>

                <div class="card">
                    <i class="fa-solid fa-x-ray"></i>
                    <span data-ar="الأشعة" data-en="Imaging">الأشعة</span>
                </div>

                <div class="card">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <span data-ar="إجراءات العيادة" data-en="Clinic Procedure">إجراءات العيادة</span>
                </div>

                <div class="card">
                    <i class="fa-solid fa-tooth"></i>
                    <span data-ar="الأسنان" data-en="Dental">الأسنان</span>
                </div>

                <div class="card">
                    <i class="fa-solid fa-ban"></i>
                    <span data-ar="إلغاء الحجز" data-en="Cancel Reservation">إلغاء الحجز</span>
                </div>

                <div class="card">
                    <i class="fa-solid fa-credit-card"></i>
                    <span data-ar="طلبات الدفع" data-en="Pay Request">طلبات الدفع</span>
                </div>

                <div class="card">
                    <i class="fa-solid fa-hand-holding-medical"></i>
                    <span data-ar="جلسات علاجية" data-en="Therapy Sections">جلسات علاجية</span>
                </div>

                <div class="card">
                    <i class="fa-solid fa-print"></i>
                    <span data-ar="إعادة طباعة الفواتير" data-en="Reprint Invoices">إعادة طباعة الفواتير</span>
                </div>
            </div>
        </div>



        <!-- النص + الوصف + الصورة في الوسط -->
        <div class="hero-center">
            <h1 data-ar="نظام ذكي لإدارة عيادتك بكل سهولة" data-en="A smart system to manage your clinic
with ease">
                نظام ذكي لإدارة عيادتك<br>
                بكل سهولة
            </h1>
            <p data-ar="احجز المواعيد، أدر المرضى، الفواتير والتقارير
                في منصة واحدة مصممة خصيصًا للقطاع الطبي." data-en="Book appointments, manage patients, invoices, and reports
all in one platform specially designed for the healthcare sector.">
                احجز المواعيد، أدر المرضى، الفواتير والتقارير
                في منصة واحدة مصممة خصيصًا للقطاع الطبي.
            </p>
            <!-- <img src="../../../../assets/images/home-img.png" alt="Clinic Management Illustration"> -->
        </div>

    </div>

    <!-- Library Bundle Script -->
    <script src="../../assets/js/core/libs.min.js"></script>

    <!-- External Library Bundle Script -->
    <script src="../../assets/js/core/external.min.js"></script>

    <!-- Widgetchart Script -->
    <script src="../../assets/js/charts/widgetcharts.js"></script>

    <!-- mapchart Script -->
    <script src="../../assets/js/charts/vectore-chart.js"></script>
    <script src="../../assets/js/charts/dashboard.js"></script>

    <!-- fslightbox Script -->
    <script src="../../assets/js/plugins/fslightbox.js"></script>

    <!-- Settings Script -->
    <script src="../../assets/js/plugins/setting.js"></script>

    <!-- Slider-tab Script -->
    <script src="../../assets/js/plugins/slider-tabs.js"></script>

    <!-- Form Wizard Script -->
    <script src="../../assets/js/plugins/form-wizard.js"></script>

    <!-- HMS Script -->
    <script src="../assets/js/hms.js"></script>

    <!-- App Script -->
    <script src="../../assets/js/hope-ui.js" defer></script>

    <!-- Language Script -->
    <script src="../../assets/js/lang.js"></script>


</body>

</html>
