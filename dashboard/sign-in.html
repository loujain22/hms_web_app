               <!-- Language Selector Dropdown -->

                     <option value="en">English</option>
                     <option value="ar">العربية</option>
                  </select>
               </div>
               <div class="row justify-content-center">
                  <div class="col-md-10">
                     <div class="card card-transparent shadow-none d-flex justify-content-center mb-0 auth-card">

                              <!-- Logo -->
                              <div class="logo-main mb-2">

                                 </div>
                              </div>

                           </div>
                           <h3 class="mb-2 text-center" data-ar="تسجيل الدخول" data-en="Login">Login</h3>
                           <p class="text-center" data-ar="مرحبًا بعودتك! الرجاء تسجيل الدخول للمتابعة."
                              data-en="Welcome back! Please sign in to continue.">Welcome back! Please sign in to
                              continue.</p>
                           <form class="needs-validation" novalidate>
                              <div class="row">
                                 <div class="col-lg-12">
                                    <div class="form-group has-validation">
                                       <label for="email" class="form-label" data-ar="البريد الإلكتروني"
                                          data-en="Email">Email</label>
                                       <input type="email" class="form-control" id="email" aria-describedby="email"
                                          placeholder=" " required>
                                       <div class="invalid-feedback" data-ar=".من فضلك أدخل البريد الإلكتروني" data-en="Please enter email address.">
                                          Please choose a email.
                                       </div>
                                    </div>
                                 </div>
                                 <div class="col-lg-12">
                                    <div class="form-group has-validation">
                                       <label for="password" class="form-label" data-ar="كلمة المرور"
                                          data-en="Passwprd">Password</label>
                                       <input type="password" class="form-control" id="password"
                                          aria-describedby="password" placeholder=" " required>
                                       <div class="invalid-feedback" data-ar=".من فضلك أدخل كلمة المرور" data-en="Please enter password.">
                                          Please choose a password.
                                       </div>
                                    </div>
                                 </div>
                                 <div class="col-lg-12 d-flex justify-content-between">
                                    <div class="form-check mb-3">
                                       <input type="checkbox" class="form-check-input" id="customCheck1">
                                       <label class="form-check-label" for="customCheck1" data-ar="هل تتزكرني"
                                          data-en="Remember Me">Remember Me</label>
                                    </div>
                                    <a href="recoverpw.html" data-ar="نسيت كلمة المرور؟"
                                       data-en="Forgot Password?">Forgot Password?</a>
                                 </div>
                              </div>
                              <div class="d-flex justify-content-center" id="login-btn">
                                 <button type="submit" class="btn btn-primary btn-b w-100" data-ar="تسجيل الدخول"
                                    data-en="Login">
                                    Login
                                 </button>
                              </div>
                           </form>
                        </div>
                     </div>
                  </div>
               </div>

                        data-en="Manage Your Clinic|Smarter & Faster">
